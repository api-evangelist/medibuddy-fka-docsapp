aid: medibuddy-fka-docsapp
name: MediBuddy (fka DocsApp)
description: 'MediBuddy (formerly DocsApp) is India''s largest digital healthcare platform,
  operated by Phasorz Technologies Private Limited and founded in 2013 by Satish Kannan and
  Enbasekar Dinadayalane. Launched as DocsApp in 2015 for online doctor consultations, it
  merged with and rebranded to MediBuddy in June 2020. The consumer platform delivers
  teleconsultations (chat, video, voice) across 20+ specialties, at-home lab-test bookings,
  online medicine delivery covering 95%+ of Indian pin codes, and health checks. It is backed
  by Bessemer Venture Partners, Quadria Capital and Rebright Partners. No public developer /
  API program was found; product access is via the consumer web and mobile apps.'
